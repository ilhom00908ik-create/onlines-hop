<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    {% block head %}
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --primary: #1d4ed8;
            --primary-2: #2563eb;
            --success: #16a34a;
            --success-2: #22c55e;
            --text: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 100%);
            color: var(--text);
        }
        .auth-shell {
            max-width: 470px; margin: 80px auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 28px;
            box-shadow: 0 16px 30px rgba(15, 23, 42, 0.08); padding: 32px 28px;
        }
        .auth-shell h1 { margin: 0 0 8px; font-size: 2rem; text-align: center; }
        .auth-shell p { margin: 0 0 26px; text-align: center; color: var(--muted); }
        form { display: grid; gap: 16px; }
        .field { display: grid; gap: 8px; }
        label { font-weight: 700; }
        input {
            width: 100%; border: 1px solid var(--line); background: #f8fafc; border-radius: 12px; padding: 12px 14px; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,78,216,0.12); }
        .btn {
            display: inline-block; width: 100%; text-align: center; padding: 13px 18px; border-radius: 12px; color: #fff;
            background: linear-gradient(135deg, var(--success), var(--success-2));
            border: none; font-weight: 800; cursor: pointer;
        }
        .errors {
            display: grid; gap: 8px; padding: 12px 16px; border-radius: 12px;
            background: #fff1f2; border: 1px solid #fecdd3; color: var(--danger);
            font-weight: 600; font-size: 0.95rem;
        }
        .bottom { margin-top: 18px; text-align: center; color: var(--muted); }
        .bottom a { color: var(--primary); font-weight: 700; }
    </style>
    {% endblock %}
</head>
<body>
    {% block content %}
    <div class="auth-shell">
        <h1>✨ Hisob yaratish</h1>
        <p>Ro'yxatdan o'tib, xaridlarni boshlang</p>

        {% if errors %}
            <div class="errors">
                {% for error in errors %}
                    <div>{{ error }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="field">
                <label for="username">Foydalanuvchi nomi</label>
                <input type="text" id="username" name="username" placeholder="Username" value="{{ username|default:'' }}" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" value="{{ email|default:'' }}" required>
            </div>
            <div class="field">
                <label for="password">Parol</label>
                <input type="password" id="password" name="password1" placeholder="Kamida 8 belgi" required minlength="8">
            </div>
            <div class="field">
                <label for="password2">Parolni tasdiqlash</label>
                <input type="password" id="password2" name="password2" placeholder="Parolni qayta kiriting" required minlength="8">
            </div>
            <button type="submit" class="btn">Ro'yxatdan o'tish</button>
        </form>

        <div class="bottom">
            Allaqachon hisobingiz bormi? <a href="{% url 'login' %}">Kirish</a>
        </div>
    </div>
    {% endblock %}
</body>
</html>
