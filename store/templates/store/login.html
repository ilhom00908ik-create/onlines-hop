<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Online Shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #000000;
            background: linear-gradient(135deg, #5713d4 0%, #8f6fd8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #c51682;
        }
        .login-container {
            background: rgba(62, 3, 129, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(175, 22, 22, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 300%;
            max-width: 600px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .login-header p {
            font-size: 0.85rem;
            color: #ffffff;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #e9e9e9;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1838c5 0%, #3bc237 50%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .errornote {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>🛍️ Online Shop</h1>
            <p>Xush kelibsiz! Mahsulot va buyurtmalarni boshqarish paneli</p>
        </div>

        {% if form.errors %}
            <div class="errornote">
                Username yoki parol xato kiritildi. Qaytadan urinib ko'ring.
            </div>
        {% endif %}

        <form action="{{ app_path }}" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Login (Username)</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" required id="id_username">
            </div>

            <div class="form-group">
                <label for="id_password">Parol</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password">
            </div>

            <input type="hidden" name="next" value="{{ next }}">
            
            <button type="submit" class="btn-submit">Kirish</button>
        </form>
    </div>

</body>
</html>
