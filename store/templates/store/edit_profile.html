{% extends 'store/base.html' %}

{% block title %}Buyurtmani rasmiylashtirish - Online Shop{% endblock %}

{% block content %}
<div class="container my-5">
    <h2>Buyurtmani rasmiylashtirish</h2>
    <div class="row mt-4">
        <div class="col-md-8">
            <form method="POST" action="{% url 'checkout' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">To'liq ismingiz</label>
                    <input type="text" name="customer_name" class="form-control" value="{{ request.user.get_full_name|default:request.user.username }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefon raqamingiz</label>
                    <input type="text" name="phone" class="form-control" placeholder="+998 90 123 45 67" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Yetkazib berish manzili</label>
                    <textarea name="address" class="form-control" rows="3" placeholder="Toshkent sh., Chilonzor tumani..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">To'lovga o'tish</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
